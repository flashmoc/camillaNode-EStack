<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Control — E-Stack Prototype</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="../../shared/components.css"><link rel="stylesheet" href="./page.css?v=control-v45"><link rel="stylesheet" href="./mixer-layout.css?v=control-v45"><link rel="stylesheet" href="./input-trim.css?v=control-v45"></head>
<body><main class="control-page">
  <h1 class="control-sr-title">E-Stack Control</h1>
  <section class="ui-panel control-inputs" aria-labelledby="inputs-title"><header class="ui-panel__head"><div><h2 id="inputs-title">INPUTS</h2></div><div class="panel-actions"><label class="ui-toggle"><input id="analyzerToggle" type="checkbox" checked> Spectrum</label></div></header><div class="inputs-body"><div id="inputMeters" class="input-meters" aria-live="polite"></div><canvas id="inputScope" width="720" height="132" aria-label="Mock input spectrum analyzer"></canvas></div></section>
  <section id="inputTrim" class="ui-panel input-trim-panel" aria-labelledby="input-trim-title"><div class="input-trim-intro"><span class="input-trim-kicker">GAIN STAGING</span><div><h2 id="input-trim-title">INPUT TRIM</h2><p>Digital L/R · post-ADC · before processing</p></div></div><div class="input-trim-control"><button id="inputTrimDown" type="button" aria-label="Reduce input trim">−</button><label><span>TRIM</span><input id="inputTrimRange" type="range" min="-20" max="12" step="0.5" value="0" aria-label="Input trim in dB"></label><output id="inputTrimValue">0.0 dB</output><button id="inputTrimUp" type="button" aria-label="Increase input trim">+</button></div><div class="input-trim-safe"><span>SAFE ADD</span><strong id="inputTrimAvailable">—</strong><small>conservative peak · 1.0 dB reserve</small><button id="inputTrimUse" type="button">USE HEADROOM</button></div></section>
  <section class="ui-panel control-mixer" aria-label="Output mixer"><div id="protectionSummary" class="protection-summary" aria-label="Mock limiter status"></div><div id="controlMixer" class="mixer-layout"></div></section>
</main><script src="../../shared/mock-camilladsp.js?v=control-v45"></script><script src="./fixtures.js?v=control-v45"></script><script src="./page.js?v=control-v45"></script></body></html>
