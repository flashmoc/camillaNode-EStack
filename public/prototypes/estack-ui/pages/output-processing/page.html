<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Output Processing — E-Stack DSP</title><link rel="stylesheet" href="../../shared/tokens.css"><link rel="stylesheet" href="../../shared/base.css"><link rel="stylesheet" href="../../shared/components.css"><link rel="stylesheet" href="./page.css?v=output-product-v4"><link rel="stylesheet" href="./graph.css?v=output-v4"></head>
<body><main class="output-page">
  <header class="output-toolbar"><div><span class="output-kicker">OUTPUT PROCESSING · POST-MIXER</span><strong>CALIBRATION WORKSPACE</strong></div><div class="output-toolbar__actions"><output id="outputState" class="ui-status">CONNECTING</output><button id="systemEdit" class="ui-button output-lock" type="button" aria-pressed="false">🔒 LOCKED</button></div></header>
  <section class="way-deck" aria-label="Outputs"><header><strong>OUTPUTS</strong><output id="sharedState" class="ui-badge">READ ONLY</output></header><div id="waySelector" class="way-selector"></div></section>
  <section class="response-workspace" aria-labelledby="selectedWayTitle"><header class="graph-toolbar"><div class="graph-toolbar__title"><strong id="selectedWayTitle">RESPONSE</strong><small id="selectedWayMeta">Live DSP configuration</small></div><div class="graph-toolbar__controls"><span class="toolbar-label">RESPONSE</span><div class="segmented" role="group" aria-label="Response mode"><button data-graph-mode="magnitude" type="button">MAGNITUDE</button><button data-graph-mode="phase" type="button">PHASE</button><button data-graph-mode="xo" type="button">XO ALIGN</button></div><label class="toolbar-field">COMPARE <select id="compareWay" class="ui-select"></select></label><label class="toolbar-check"><input id="allXos" type="checkbox" checked> ALL XOs</label><label class="toolbar-check"><input id="analyzerEnabled" type="checkbox"> ANALYZER</label></div><div id="xoControls" class="graph-toolbar__secondary" hidden><label>PAIR <select id="xoPair" class="ui-select"></select></label><output id="xoReadout">—</output></div><div id="analyzerControls" class="graph-toolbar__secondary" hidden><span>ANALYZER</span><div class="segmented"><button data-analyzer-mode="raw" type="button">RAW</button><button data-analyzer-mode="fast" type="button">FAST</button><button data-analyzer-mode="slow" type="button">SLOW</button></div><label class="toolbar-check"><input id="analyzerInfinite" type="checkbox"> INFINITE</label><button id="analyzerReset" class="ui-button" type="button">RESET</button><div class="segmented analyzer-views"><button data-analyzer-view="full" type="button">FULL</button><button data-analyzer-view="sub" type="button">SUB</button><button data-analyzer-view="low" type="button">LOW</button><button data-analyzer-view="mid" type="button">MID</button><button data-analyzer-view="high" type="button">HIGH</button></div><output id="analyzerStatus">OFF</output></div></header><div class="response-canvas"><canvas id="responseGraph" width="1200" height="360" aria-label="Theoretical output response"></canvas><output id="graphState">LIVE DSP CONFIG</output></div></section>
  <section class="calibration-rack"><header><div><strong>OUTPUT / ALIGN / PROTECTION</strong><small>Selected path · guarded live commits when System Edit is enabled</small></div><output id="editState" class="ui-badge is-warning">LOCKED</output></header><div id="outputControls" class="output-controls"></div><div id="protectionMetrics" class="protection-metrics"></div></section>
  <section class="filtering-grid"><section class="filtering-section peq-section"><header class="filtering-heading"><strong>PARAMETRIC EQ</strong><button id="addPeq" class="ui-button" type="button">+ ADD PEQ</button></header><div id="peqRows" class="peq-rows"></div></section><section class="filtering-section crossover-section"><header class="filtering-heading"><strong>CROSSOVER</strong><output id="crossoverScope" class="ui-badge">—</output></header><div id="crossoverControls" class="crossover-controls"></div></section></section>
</main><script src="../../shared/estack-dsp-bridge.js?v=output-v1"></script><script src="../../shared/domain/pipeline.js?v=output-v1"></script><script src="../../shared/domain/output-processing-model.js?v=output-v1"></script><script src="../../shared/domain/output-processing-service.js?v=output-v1"></script><script src="./graph-analysis.js?v=output-v4"></script><script src="./page.js?v=output-v4"></script></body></html>
