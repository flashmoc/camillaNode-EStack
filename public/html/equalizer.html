<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Stack DSP</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackEqualizer.css">
    <link rel="stylesheet" href="/css/estackVenuPolish.css">
    <link rel="stylesheet" href="/css/estackGlobalGraph.css">
    <link rel="stylesheet" href="/css/estackEditorRestore.css">
    <link rel="stylesheet" href="/css/estackSiteTheme.css">
    <link rel="stylesheet" href="/css/estackPeqRack.css">
    <link rel="stylesheet" href="/css/estackPeqRackFix.css">
    <script src="/src/estackEqualizer.js" defer></script>
    <script src="/src/estackVenuPolish.js" defer></script>
    <script src="/src/estackGlobalGraph.js" defer></script>
    <script src="/src/estackEditorRestore.js" defer></script>
    <script src="/src/estackPeqRack.js" defer></script>
    <script src="/src/estackOutputScope.js" defer></script>
</head>
<body class="estack-dsp-page">
    <header class="venu-page-head">
        <div class="venu-page-identity">
            <span class="venu-eyebrow">E-STACK DSP</span>
            <strong id="selectedChannelTitle">Output</strong>
            <span id="selectedChannelMeta"></span>
        </div>
        <button id="systemEditToggle" class="venu-system-edit" aria-pressed="false">EDIT SYSTEM</button>
    </header>

    <nav id="channelTabs" class="venu-output-tabs" aria-label="E-Stack outputs"></nav>

    <section class="venu-rta-strip" aria-label="Live spectrum analyzer">
        <div class="venu-rta-label">
            <strong>LIVE SPECTRUM</strong>
            <span>Analyzer · port 6413</span>
        </div>
        <div class="venu-rta-canvas-wrap">
            <canvas id="rtaCanvas"></canvas>
            <div class="venu-rta-scale" aria-hidden="true">
                <span>20</span><span>100</span><span>1k</span><span>10k</span><span>20k</span>
            </div>
        </div>
    </section>

    <nav id="moduleTabs" class="venu-module-tabs" aria-label="DSP modules">
        <button data-module="crossover" class="active">Crossover</button>
        <button data-module="peq">Parametric EQ</button>
        <button data-module="output">Output</button>
        <button data-module="protection">Protection</button>
    </nav>

    <main class="venu-workspace">
        <div class="venu-module-title">
            <div>
                <strong id="moduleTitle">System Response</strong>
                <span id="moduleSubtitle">All outputs</span>
            </div>
            <div class="venu-graph-legend" aria-label="Output response legend"></div>
        </div>

        <section class="venu-graph-wrap">
            <canvas id="responseCanvas"></canvas>
        </section>

        <div id="bandSelector" class="venu-band-selector"></div>
        <section id="moduleControls" class="venu-controls"></section>

        <footer class="venu-statusbar">
            <span id="estackEqStatus">Loading DSP...</span>
            <span id="estackEqCount"></span>
        </footer>
    </main>
</body>
</html>
