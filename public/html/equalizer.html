<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Stack DSP</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackEqualizer.css">
    <script src="/src/estackEqualizer.js" defer></script>
</head>
<body>
    <div id="sectionMainTitle"><img src="img/icon/equalizer.png" class="icon">E-Stack DSP</div>

    <div id="channelTabs" class="estack-channel-tabs"></div>

    <section class="estack-response-panel">
        <div class="estack-response-header">
            <div>
                <strong id="selectedChannelTitle">Output</strong>
                <span id="selectedChannelMeta"></span>
            </div>
            <div class="estack-legend">
                <span><i class="legend-total"></i>Total response</span>
                <span><i class="legend-system"></i>Crossover</span>
                <span><i class="legend-peq"></i>PEQ</span>
            </div>
        </div>
        <canvas id="responseCanvas"></canvas>
        <div id="spectrum" class="estack-spectrum"></div>
    </section>

    <div class="estack-eq-toolbar">
        <div id="estackEqStatus">Loading DSP...</div>
        <div id="estackEqCount"></div>
    </div>

    <div class="estack-dsp-grid">
        <section class="estack-module" id="crossoverModule">
            <div class="estack-module-title"><span>Crossover</span><small>HPF / LPF</small></div>
            <div id="crossoverControls"></div>
        </section>

        <section class="estack-module" id="outputModule">
            <div class="estack-module-title"><span>Output</span><small>gain · polarity · delay</small></div>
            <div id="outputControls"></div>
        </section>

        <section class="estack-module estack-module-wide" id="peqModule">
            <div class="estack-module-title">
                <span>Parametric EQ</span>
                <button id="addPeqButton" class="estack-primary-button">+ Add PEQ</button>
            </div>
            <div id="peqControls"></div>
        </section>

        <section class="estack-module" id="protectionModule">
            <div class="estack-module-title"><span>Protection</span><small>limiter / processor</small></div>
            <div id="protectionControls"></div>
        </section>

        <section class="estack-module" id="otherModule">
            <div class="estack-module-title"><span>Other DSP</span><small>remaining filters</small></div>
            <div id="otherControls"></div>
        </section>
    </div>
</body>
</html>
