<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Stack DSP</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackEqualizer.css">
    <script src="/src/estackEqualizer.js" defer></script>
</head>
<body>
    <div class="venu-topline">
        <div>
            <span class="venu-brand">E-STACK</span>
            <strong id="selectedChannelTitle">SUB</strong>
            <span id="selectedChannelMeta">OUT 1</span>
        </div>
        <button id="systemEditToggle" class="venu-edit-toggle" aria-pressed="false">EDIT SYSTEM</button>
    </div>

    <div id="channelTabs" class="venu-output-tabs"></div>

    <div id="moduleTabs" class="venu-module-tabs">
        <button data-module="crossover" class="active">Crossover</button>
        <button data-module="peq">Parametric EQ</button>
        <button data-module="output">Output</button>
        <button data-module="protection">Protection</button>
    </div>

    <section class="venu-workspace">
        <div class="venu-module-title">
            <strong id="moduleTitle">Crossover</strong>
            <span id="moduleSubtitle">SUB · Output 1</span>
        </div>

        <div class="venu-graph-wrap">
            <canvas id="responseCanvas"></canvas>
        </div>

        <div id="bandSelector" class="venu-band-selector"></div>
        <div id="moduleControls" class="venu-controls"></div>
    </section>

    <div class="venu-statusbar">
        <span id="estackEqStatus">Loading DSP...</span>
        <span id="estackEqCount"></span>
    </div>
</body>
</html>
