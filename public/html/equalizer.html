<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output Processing</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackEqV4.css">
    <link rel="stylesheet" href="/css/estackEqKnobGeometry.css">
    <link rel="stylesheet" href="/css/estackEqResponsive.css">

    <script src="/src/estackEqualizer.js" defer></script>
    <script src="/src/estackProcessorVisibility.js" defer></script>
    <script src="/src/estackVenuPolish.js" defer></script>
    <script src="/src/estackGlobalGraph.js" defer></script>
    <script src="/src/estackEditorRestore.js" defer></script>
    <script src="/src/estackPeqRack.js" defer></script>
    <script src="/src/estackPeqPipelineOrder.js" defer></script>
    <script src="/src/estackOutputScope.js" defer></script>
    <script src="/src/estackSpectrumPro.js" defer></script>
    <script src="/src/estackEqEight.js" defer></script>
    <script src="/src/estackEqEightV2.js" defer></script>
    <script src="/src/estackEqZeroSnap.js" defer></script>
    <script src="/src/estackEqV4.js" defer></script>
    <script src="/src/estackPeqIsolationFix.js" defer></script>
    <script src="/src/estackDynamicPeq.js" defer></script>
</head>
<body class="estack-eq-v4">
    <div class="eq-v4-shell">
        <div class="eq-v4-engine-mount" aria-hidden="true">
            <strong id="selectedChannelTitle">Output</strong>
            <span id="selectedChannelMeta"></span>
            <nav id="channelTabs" class="venu-output-tabs"></nav>
            <div class="venu-rta-strip">
                <div class="venu-rta-label"><strong>LIVE SPECTRUM</strong><span>Analyzer</span></div>
                <div class="venu-rta-canvas-wrap"><canvas id="rtaCanvas"></canvas></div>
            </div>
        </div>

        <div class="eq-v4-topbar">
            <nav id="moduleTabs" class="venu-module-tabs" aria-label="DSP modules">
                <button data-module="peq" class="active">EQ</button>
                <button data-module="outputProtection">OUTPUT / PROTECTION</button>
            </nav>

            <div class="eq-v4-context">
                <strong id="moduleTitle">Parametric EQ</strong>
                <span id="moduleSubtitle"></span>
            </div>

            <div class="venu-graph-legend" aria-label="Select output to edit"></div>

            <button id="systemEditToggle" class="venu-system-edit" aria-pressed="false">EDIT SYSTEM</button>
        </div>

        <div class="venu-workspace">
            <div class="venu-graph-wrap" aria-label="System response and live analyzer">
                <canvas id="responseCanvas"></canvas>
            </div>

            <div id="bandSelector" class="venu-band-selector"></div>
            <div id="moduleControls" class="venu-controls"></div>

            <div class="venu-statusbar">
                <span id="estackEqStatus">Loading DSP…</span>
                <span id="estackEqCount"></span>
            </div>
        </div>
    </div>
</body>
</html>
