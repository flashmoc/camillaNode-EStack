<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=100vw, initial-scale=1.0">
    <title>E-Stack Control</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackBasic.css">
    <script src="/src/estackBasic.js" defer></script>
</head>
<body>
    <div id="sectionMainTitle"><img src="img/icon/basic.png" class="icon">E-Stack Control</div>

    <section class="estack-mixer group" label="Levels & Outputs">
        <div class="estack-control-head">
            <div>
                <strong>Output Mixer</strong>
                <span>Master volume and per-output gain. Existing E-Stack Gain filters only.</span>
            </div>
            <div id="mixerStatus" class="estack-mixer-status">Loading DSP…</div>
        </div>

        <div id="estackMixerStrips" class="estack-mixer-strips"></div>
    </section>

    <div class="estack-control-note">
        Output faders edit the existing Gain filter of each loudspeaker way. Crossovers, delays, PEQ and protection filters are not changed here.
    </div>
</body>
</html>
