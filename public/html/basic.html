<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Stack Control</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackBasicLinks.css">
    <link rel="stylesheet" href="/css/estackInputs.css">
    <link rel="stylesheet" href="/css/estackControlUnified.css">
    <link rel="stylesheet" href="/css/estackControlSpectrum.css">
    <link rel="stylesheet" href="/css/estackControlSafety.css">
    <link rel="stylesheet" href="/css/estackControlFineAdjust.css">
    <link rel="stylesheet" href="/css/estackControlNormalizeWays.css">
    <link rel="stylesheet" href="/css/estackTheme.css">
    <script src="/src/estackBasic.js" defer></script>
    <script src="/src/estackControlLinksRestore.js" defer></script>
    <script src="/src/estackControlInputCompat.js" defer></script>
    <script src="/src/estackInputMeters.js" defer></script>
    <script src="/src/estackControlUnified.js" defer></script>
    <script src="/src/estackControlMuteFix.js" defer></script>
    <script src="/src/estackControlSpectrum.js" defer></script>
    <script src="/src/estackControlSafety.js" defer></script>
    <script src="/src/estackControlFineAdjust.js" defer></script>
    <script src="/src/estackControlNormalizeWays.js" defer></script>
</head>
<body>
    <div id="sectionMainTitle"><img src="/img/icon/basic.png" class="icon">E-Stack Control</div>

    <section class="estack-inputs group" label="Inputs">
        <div class="estack-input-head">
            <div><strong>Inputs</strong></div>
            <div class="estack-input-actions">
                <div class="estack-input-badge">RAW ADC · dBFS · READ ONLY</div>
                <div id="inputMeterStatus" class="estack-input-status">Loading capture meters…</div>
            </div>
        </div>
        <div id="estackInputMeters" class="estack-input-meter-grid"></div>
        <div id="estackInputSpectrum" class="estack-input-spectrum" aria-label="Input spectrum analyzer">
            <span id="estackInputSpectrumStatus" class="estack-input-spectrum-status">SPECTRUM</span>
            <canvas id="estackInputSpectrumCanvas"></canvas>
        </div>
    </section>

    <section class="estack-mixer group" label="Levels & Outputs">
        <div class="estack-control-head">
            <div><strong>Output Mixer</strong></div>
            <div class="estack-control-actions">
                <div id="linkControls" class="estack-link-controls" aria-label="Stereo gain links"></div>
                <div id="mixerStatus" hidden aria-live="polite"></div>
            </div>
        </div>

        <div id="estackMixerStrips" class="estack-mixer-strips"></div>
    </section>
</body>
</html>
