<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Processing</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/estackEqV4.css">
    <link rel="stylesheet" href="/css/estackEqKnobGeometry.css">
    <link rel="stylesheet" href="/css/estackEqResponsive.css">
    <link rel="stylesheet" href="/css/estackTheme.css">
    <link rel="stylesheet" href="/css/estackInputProcessing.css">
    <link rel="stylesheet" href="/css/estackProcessingUnified.css">
    <link rel="stylesheet" href="/css/estackGlobalEqPresets.css">

    <script src="/src/estackInputDelay.js" defer></script>
    <script src="/src/estackGlobalEq.js" defer></script>
    <script src="/src/estackGlobalEqBridge.js" defer></script>
    <script src="/src/estackGlobalEqGuard.js" defer></script>
    <script src="/src/estackGlobalEqCanvasFix.js" defer></script>
    <script src="/src/estackGlobalEqV2.js" defer></script>
    <script src="/src/estackEqV4.js" defer></script>
    <script src="/src/estackGlobalEqPresets.js" defer></script>
    <script src="/src/estackGlobalEqRange12.js" defer></script>
    <script src="/src/estackGlobalEqBandCurves.js" defer></script>
</head>
<body class="global-eq-v4 global-v2-page">
    <div id="sectionMainTitle" class="processing-page-title"><img src="/img/icon/equalizer.png" class="icon">Input Processing</div>

    <div class="global-v2-graph-panel">
        <div class="global-v2-graph-head">
            <strong>Global EQ</strong>
            <span>Response / Analyzer · shared Input L/R · pre-routing</span>
        </div>
        <div class="global-v2-canvas-wrap">
            <canvas id="globalEqCanvas"></canvas>
        </div>
    </div>

    <div class="global-v2-console estack-peq-console estack-eq8-console">
        <div class="estack-peq-equalizer global-v2-equalizer">
            <div class="estack-peq-eq-head global-v2-eq-head">
                <div><strong>Parametric EQ</strong><span>10 bands · shared L/R</span></div>
                <button type="button" id="globalEqResetAll" class="global-v2-reset-all">RESET ALL</button>
            </div>
            <div id="globalEqBands" class="estack-peq-strips global-v2-bands"></div>
        </div>

        <aside class="estack-eq8-analyzer global-v2-analyzer">
            <div class="estack-eq8-analyzer-head">
                <strong>Analyzer</strong><i class="estack-eq8-analyzer-led"></i>
            </div>
            <div class="global-v2-analyzer-label">SPEED</div>
            <div class="global-v2-analyzer-modes">
                <button type="button" id="globalEqFast" class="active">FAST</button>
                <button type="button" id="globalEqSlow">SLOW</button>
            </div>
            <div class="global-v2-analyzer-label">HOLD</div>
            <button type="button" id="globalEqInfinite" class="global-v2-analyzer-button active">INFINITE</button>
            <button type="button" id="globalEqResetInfinite" class="global-v2-analyzer-button">RESET</button>
        </aside>
    </div>

    <section class="input-processing-delay" aria-label="Global input delay">
        <div class="input-delay-head">
            <div class="input-delay-head-copy">
                <strong>Input Delay</strong>
                <span>Global L/R · preserves all relative output delays</span>
            </div>
            <span id="inputDelayState">BYPASS</span>
        </div>

        <div class="input-delay-body">
            <div class="input-delay-range-wrap">
                <input id="inputDelayRange" class="input-delay-control" type="range" min="0" max="500" step="0.1" value="0" aria-label="Input delay quick range">
                <output id="inputDelayReadout">0.0 ms</output>
            </div>

            <div class="input-delay-nudge" aria-label="Input delay nudges">
                <button type="button" class="input-delay-control" data-delay-step="-10">−10</button>
                <button type="button" class="input-delay-control" data-delay-step="-1">−1</button>
                <button type="button" class="input-delay-control" data-delay-step="1">+1</button>
                <button type="button" class="input-delay-control" data-delay-step="10">+10</button>
            </div>

            <div class="input-delay-number-wrap">
                <input id="inputDelayNumber" class="input-delay-control" type="number" min="0" max="2000" step="0.1" inputmode="decimal" value="0.0" aria-label="Input delay in milliseconds">
                <span>ms</span>
                <button type="button" id="inputDelayReset" class="input-delay-control">RESET</button>
            </div>
        </div>
        <div id="inputDelayStatus" class="input-delay-status">Connecting to CamillaDSP…</div>
    </section>

    <div class="global-v2-statusbar">
        <span id="globalEqStatus">Connecting to CamillaDSP…</span>
    </div>
</body>
</html>
